name: Uji dan terbitkan ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Biarkan satu penerbitan selesai sebelum yang berikutnya jalan.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bangun:
    name: Uji aturan dan bangun berkas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Tidak ada dependensi npm, jadi tidak perlu `npm install`.
      - name: Jalankan 26 tes aturan permainan
        run: npm test

      - name: Bangun berkas HTML mandiri
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  terbitkan:
    name: Terbitkan
    needs: bangun
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
